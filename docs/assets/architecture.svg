<svg xmlns="http://www.w3.org/2000/svg" width="880" height="750" viewBox="0 0 880 750" role="img" aria-labelledby="t d">
<title id="t">How SAI Pen Pressure fits together</title>
<desc id="d">The tablet feeds the SAI Pen Pressure app, which sends every pen sample over UDP to our wintab32.dll inside sai2.exe. SAI, its licence, our DLL, the control files and the timelapse frames all live in the Wine prefix ~/SAI2-pressure, and Wine Staging in /Applications runs sai2.exe from there. A separate encoder turns the frames into videos in ~/Movies.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .bg { fill: #ffffff; }
  .h { font-size: 15px; font-weight: 600; }
  .s { font-size: 12.5px; }
  .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
  .ct { fill: #E1F5EE; stroke: #0F6E56; }
  .cp { fill: #EEEDFE; stroke: #534AB7; }
  .bt { fill: #ffffff; stroke: #0F6E56; }
  .bp { fill: #ffffff; stroke: #534AB7; }
  .bg2 { fill: #F1EFE8; stroke: #5F5E5A; }
  .tt { fill: #085041; } .st { fill: #0F6E56; }
  .tp { fill: #3C3489; } .sp { fill: #534AB7; }
  .tg { fill: #2C2C2A; } .sg { fill: #5F5E5A; }
  .a { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
  .ah { fill: #5F5E5A; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .ct { fill: #04342C; stroke: #5DCAA5; }
    .cp { fill: #26215C; stroke: #AFA9EC; }
    .bt { fill: #085041; stroke: #5DCAA5; }
    .bp { fill: #3C3489; stroke: #AFA9EC; }
    .bg2 { fill: #2C2C2A; stroke: #B4B2A9; }
    .tt { fill: #E1F5EE; } .st { fill: #9FE1CB; }
    .tp { fill: #EEEDFE; } .sp { fill: #CECBF6; }
    .tg { fill: #F1EFE8; } .sg { fill: #D3D1C7; }
    .a { stroke: #B4B2A9; }
    .ah { fill: #B4B2A9; }
  }
</style>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M1 1L9 5L1 9z" class="ah"/>
  </marker>
</defs>
<rect class="bg" x="0" y="0" width="880" height="750" rx="12"/>

<!-- outside: your SAI folder, the tablet -->
<rect class="bg2" x="20" y="100" width="156" height="56" rx="8" stroke-width="1"/>
<text class="h tg" x="98" y="123" text-anchor="middle">Your SAI folder</text>
<text class="s sg" x="98" y="143" text-anchor="middle">sai2.exe + your .slc</text>

<rect class="bg2" x="20" y="294" width="156" height="56" rx="8" stroke-width="1"/>
<text class="h tg" x="98" y="317" text-anchor="middle">Tablet</text>
<text class="s sg" x="98" y="337" text-anchor="middle">USB or Bluetooth</text>

<!-- the app -->
<rect class="ct" x="200" y="40" width="250" height="550" rx="18" stroke-width="1"/>
<text class="h tt" x="220" y="66">SAI Pen Pressure.app</text>
<text class="m st" x="220" y="86">/Applications</text>

<rect class="bt" x="220" y="100" width="210" height="126" rx="8" stroke-width="1"/>
<text class="h tt" x="325" y="124" text-anchor="middle">Setup window</text>
<text class="s st" x="325" y="148" text-anchor="middle">Setup, Pen, Keys, Recording,</text>
<text class="s st" x="325" y="166" text-anchor="middle">Videos and Advanced tabs</text>
<text class="s st" x="325" y="194" text-anchor="middle">Copies SAI and your licence</text>
<text class="s st" x="325" y="212" text-anchor="middle">into the prefix, sets up Wine</text>

<rect class="bt" x="220" y="294" width="210" height="56" rx="8" stroke-width="1"/>
<text class="h tt" x="325" y="317" text-anchor="middle">Pen engine</text>
<text class="s st" x="325" y="337" text-anchor="middle">Event tap, pen feel, UDP 47800</text>

<rect class="bt" x="220" y="366" width="210" height="56" rx="8" stroke-width="1"/>
<text class="h tt" x="325" y="389" text-anchor="middle">SAI process</text>
<text class="s st" x="325" y="409" text-anchor="middle">Starts SAI, wakes it, records</text>

<rect class="bt" x="220" y="438" width="210" height="56" rx="8" stroke-width="1"/>
<text class="h tt" x="325" y="461" text-anchor="middle">Videos library</text>
<text class="s st" x="325" y="481" text-anchor="middle">Groups sessions by drawing</text>

<rect class="bt" x="220" y="510" width="210" height="56" rx="8" stroke-width="1"/>
<text class="h tt" x="325" y="533" text-anchor="middle">Inside the .app</text>
<text class="s st" x="325" y="553" text-anchor="middle">DLL, encoder, test probe</text>

<!-- Wine -->
<rect class="bg2" x="490" y="40" width="370" height="56" rx="8" stroke-width="1"/>
<text class="h tg" x="675" y="63" text-anchor="middle">Wine Staging.app</text>
<text class="s sg" x="675" y="83" text-anchor="middle">/Applications, runs sai2.exe from the prefix</text>

<!-- the prefix -->
<rect class="cp" x="490" y="120" width="370" height="470" rx="18" stroke-width="1"/>
<text class="m tp" x="510" y="146">~/SAI2-pressure</text>
<text class="s sp" x="510" y="164">Wine prefix: SAI's own C: drive</text>

<rect class="bp" x="510" y="178" width="330" height="100" rx="8" stroke-width="1"/>
<text class="m tp" x="526" y="200">drive_c/SAI2/</text>
<text class="s sp" x="526" y="222">SAI runs from here, copied from your folder.</text>
<text class="s sp" x="526" y="242">Your .slc licence file is copied here too,</text>
<text class="s sp" x="526" y="262">and into settings/, where newer SAI looks.</text>

<rect class="bp" x="510" y="294" width="330" height="56" rx="8" stroke-width="1"/>
<text class="m tp" x="675" y="317" text-anchor="middle">windows/system32/wintab32.dll</text>
<text class="s sp" x="675" y="337" text-anchor="middle">Ours, loaded into sai2.exe in place of Wine's</text>

<rect class="bp" x="510" y="366" width="330" height="56" rx="8" stroke-width="1"/>
<text class="m tp" x="675" y="389" text-anchor="middle">drive_c/wt_*.txt</text>
<text class="s sp" x="675" y="409" text-anchor="middle">Pressure scale, wake, zoom, bridge status</text>

<rect class="bp" x="510" y="438" width="330" height="56" rx="8" stroke-width="1"/>
<text class="m tp" x="675" y="461" text-anchor="middle">user.reg, system.reg</text>
<text class="s sp" x="675" y="481" text-anchor="middle">Our DLL, fonts for Asian text, keys, Retina</text>

<rect class="bp" x="510" y="510" width="330" height="56" rx="8" stroke-width="1"/>
<text class="m tp" x="675" y="533" text-anchor="middle">drive_c/sai-timelapse/frames/</text>
<text class="s sp" x="675" y="553" text-anchor="middle">Raw canvas frames, written by the DLL</text>

<!-- bottom row -->
<rect class="bt" x="200" y="624" width="250" height="96" rx="8" stroke-width="1"/>
<text class="h tt" x="325" y="647" text-anchor="middle">App settings</text>
<text class="m st" x="325" y="669" text-anchor="middle" style="font-size:12px">~/Library/Application Support/</text>
<text class="m st" x="325" y="687" text-anchor="middle" style="font-size:12px">SAIPenPressure/</text>
<text class="s st" x="325" y="707" text-anchor="middle">license/ keeps a copy of your .slc</text>

<rect class="bg2" x="490" y="624" width="160" height="56" rx="8" stroke-width="1"/>
<text class="h tg" x="570" y="647" text-anchor="middle">Encoder</text>
<text class="s sg" x="570" y="667" text-anchor="middle">Own process, H.264</text>

<rect class="bg2" x="690" y="624" width="170" height="56" rx="8" stroke-width="1"/>
<text class="m tg" x="775" y="647" text-anchor="middle">~/Movies/</text>
<text class="s sg" x="775" y="667" text-anchor="middle">SAI Timelapses</text>

<!-- arrows -->
<line class="a" x1="176" y1="128" x2="216" y2="128" marker-end="url(#ar)"/>
<line class="a" x1="176" y1="322" x2="216" y2="322" marker-end="url(#ar)"/>
<line class="a" x1="430" y1="198" x2="506" y2="198" marker-end="url(#ar)"/>
<line class="a" x1="430" y1="322" x2="506" y2="322" marker-end="url(#ar)"/>
<line class="a" x1="434" y1="394" x2="506" y2="394" marker-start="url(#ar)" marker-end="url(#ar)"/>
<line class="a" x1="800" y1="96" x2="800" y2="174" marker-end="url(#ar)"/>
<line class="a" x1="570" y1="566" x2="570" y2="620" marker-end="url(#ar)"/>
<line class="a" x1="325" y1="590" x2="325" y2="620" marker-end="url(#ar)"/>
<line class="a" x1="650" y1="652" x2="686" y2="652" marker-end="url(#ar)"/>
</svg>
