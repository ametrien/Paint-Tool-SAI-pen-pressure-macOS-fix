  .bw { fill: #ffffff; stroke: #5F5E5A; }
  .bx { fill: #FAEEDA; stroke: #BA7517; }
  .tt { fill: #085041; } .st { fill: #0F6E56; }
  .tp { fill: #3C3489; } .sp { fill: #534AB7; }
  .tg { fill: #2C2C2A; } .sg { fill: #5F5E5A; }
  .tx { fill: #854F0B; }
  .a { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
  .ah { fill: #5F5E5A; }
  .kx { stroke: #BA7517; stroke-width: 1.5; fill: none; }
  .kt { stroke: #0F6E56; stroke-width: 1.5; fill: none; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .ct { fill: #04342C; stroke: #5DCAA5; }
    .bt { fill: #085041; stroke: #5DCAA5; }
    .bp { fill: #3C3489; stroke: #AFA9EC; }
    .bg2 { fill: #2C2C2A; stroke: #B4B2A9; }
    .bw { fill: #444441; stroke: #B4B2A9; }
    .bx { fill: #412402; stroke: #EF9F27; }
    .tt { fill: #E1F5EE; } .st { fill: #9FE1CB; }
    .tp { fill: #EEEDFE; } .sp { fill: #CECBF6; }
    .tg { fill: #F1EFE8; } .sg { fill: #D3D1C7; }
    .tx { fill: #FAC775; }
    .a { stroke: #B4B2A9; }
    .ah { fill: #B4B2A9; }
    .kx { stroke: #EF9F27; }
    .kt { stroke: #5DCAA5; }
  }
</style>
