<svg xmlns="http://www.w3.org/2000/svg" width="880" height="428" viewBox="0 0 880 428" role="img" aria-labelledby="t d">
<title id="t">Where pen pressure travels: a virtual machine or this project</title>
<desc id="d">In a virtual machine the tablet goes through macOS, then the VM app forwards it over virtual USB to a Windows driver inside the guest, and only then to SAI; the virtual USB and guest driver are where pressure gets lost or arrives late. With SAI Pen Pressure the tablet stays on macOS with its usual driver, the app reads pressure and adds your pen feel, sends it over a local UDP connection to our wintab32.dll inside SAI, and SAI runs in Wine.</desc>
