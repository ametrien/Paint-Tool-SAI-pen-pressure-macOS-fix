name: release

# Push a tag like v0.1.1 and CI builds the app, zips it, and attaches it to a
# GitHub Release — no human zipping/uploading, no stale assets.
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write   # create the release + upload the asset

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: bash tests/run-tests.sh

      - name: Build the .app (version = the pushed tag)
        run: SAIPP_VERSION="${GITHUB_REF_NAME#v}" bash make-app.sh

      - name: Zip the app (ditto preserves the bundle correctly)
        run: |
          cd dist
          ditto -c -k --keepParent "SAI Pen Pressure.app" "SAI-Pen-Pressure-${GITHUB_REF_NAME}.zip"
          # Safety: never ship a SAI license or a SAI binary. The ONE .exe we do
          # ship is our own bridge probe, cross-built from wintab-src/wtprobe.c
          # in this repo; a blanket "no .exe" would now reject every release.
          BAD="$(unzip -l "SAI-Pen-Pressure-${GITHUB_REF_NAME}.zip" \
                 | grep -iE "\.slc|\.exe" | grep -ivE "wtprobe\.exe" || true)"
          if [ -n "$BAD" ]; then echo "unexpected payload in the zip:"; echo "$BAD"; exit 1; fi

      - name: Build the .dmg (drag-to-Applications)
        run: |
          STAGE="dist/dmg"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          cp -R "dist/SAI Pen Pressure.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "SAI Pen Pressure" -srcfolder "$STAGE" \
            -ov -format UDZO "dist/SAI-Pen-Pressure-${GITHUB_REF_NAME}.dmg"
          hdiutil verify "dist/SAI-Pen-Pressure-${GITHUB_REF_NAME}.dmg"

      - name: Create/refresh the GitHub Release with the zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ZIP="dist/SAI-Pen-Pressure-${GITHUB_REF_NAME}.zip"
          DMG="dist/SAI-Pen-Pressure-${GITHUB_REF_NAME}.dmg"
          # One-line summary for the release = the annotated tag's message.
          # Cut releases with:  git tag -a vX.Y.Z -m "Short: what changed"
          #
          # THE TRAP (v0.3.11): actions/checkout does not fetch the tag. It
          # fetches the COMMIT into refs/tags/vX.Y.Z, so the annotated tag
          # becomes a plain pointer and %(contents:subject) reads the commit's
          # message ("Merge pull request #47 ...") instead of the summary.
          # Fetch the real tag object first, and say so if it is still not an
          # annotated tag rather than putting the wrong line on the release.
          git fetch --force --no-tags --depth=1 origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          SUMMARY=""
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag" ]; then
            SUMMARY="$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")"
          else
            echo "::warning::$GITHUB_REF_NAME is not an annotated tag, so the release gets no summary line. Cut releases with git tag -a."
          fi
          gh release create "$GITHUB_REF_NAME" --generate-notes "$DMG" "$ZIP" \
            || gh release upload "$GITHUB_REF_NAME" "$DMG" "$ZIP" --clobber
          # Prepend the summary sentence above the auto-generated notes.
          if [ -n "$SUMMARY" ]; then
            BODY="$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)"
            printf '**%s**\n\n---\n\n%s' "$SUMMARY" "$BODY" \
              | gh release edit "$GITHUB_REF_NAME" --notes-file -
          fi
